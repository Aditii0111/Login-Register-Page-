<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Register</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{
      --accent:#6c63ff;
      --accent-2:#00d4ff;
      --text:#ffffff;
      --card:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.18);
      --input:rgba(255,255,255,0.12);
    }

    body.light{
      --text:#111;
      --card:rgba(255,255,255,0.75);
      --border:rgba(0,0,0,0.1);
      --input:rgba(0,0,0,0.05);
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 20% 20%,#6c63ff55,transparent 40%),
                 radial-gradient(circle at 80% 80%,#00d4ff55,transparent 40%),
                 linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      transition:0.4s ease;
      color:var(--text);
    }

    body.light{
      background:radial-gradient(circle at 20% 20%,#6c63ff33,transparent 40%),
                 radial-gradient(circle at 80% 80%,#00d4ff33,transparent 40%),
                 linear-gradient(135deg,#eef2f3,#d9e4f5);
    }

    .theme-toggle{
      position:fixed;
      top:20px;
      right:20px;
      width:46px;
      height:46px;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--card);
      backdrop-filter:blur(12px);
      color:var(--text);
      font-size:20px;
      cursor:pointer;
    }

    .container{
      width:380px;
      background:var(--card);
      backdrop-filter:blur(18px);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:0 30px 60px rgba(0,0,0,0.4);
      overflow:hidden;
    }

    .tabs{
      display:flex;
    }

    .tabs button{
      flex:1;
      padding:16px;
      background:transparent;
      border:none;
      color:var(--text);
      font-size:15px;
      cursor:pointer;
      opacity:0.6;
      transition:0.3s;
    }

    .tabs button.active{
      opacity:1;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;
      font-weight:600;
    }

    form{
      padding:28px 26px 32px;
      display:none;
      animation:fade 0.4s ease;
    }

    form.active{display:block;}

    @keyframes fade{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    h2{
      text-align:center;
      margin-bottom:22px;
      font-weight:600;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .input-group{margin-bottom:16px;}

    .input-group label{
      font-size:13px;
      opacity:0.8;
      display:block;
      margin-bottom:6px;
    }

    .input-group input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--input);
      color:var(--text);
      outline:none;
      transition:0.3s;
    }

    .input-group input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 2px #6c63ff33;
    }

    .error{
      font-size:12px;
      color:#ff6b6b;
      margin-top:4px;
      display:none;
    }

    .btn{
      width:100%;
      padding:13px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:8px;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 25px rgba(108,99,255,0.35);
    }

    .success{
      text-align:center;
      font-size:13px;
      color:#4caf50;
      margin-top:10px;
      display:none;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <div class="container">
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
    
    <form id="loginForm" class="active">
      <h2>Login</h2>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" />
        <div class="error" id="loginEmailError">Enter valid email</div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" />
        <div class="error" id="loginPasswordError">Password required</div>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="success" id="loginSuccess">Login Successful!</div>
    </form>

    <form id="registerForm">
      <h2>Register</h2>
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="regName" />
        <div class="error" id="regNameError">Name required</div>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" />
        <div class="error" id="regEmailError">Enter valid email</div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPassword" />
        <div class="error" id="regPasswordError">Min 6 characters</div>
      </div>
      <button type="submit" class="btn">Register</button>
      <div class="success" id="regSuccess">Registration Successful!</div>
    </form>
  </div>

  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const themeToggle = document.getElementById('themeToggle');

    loginTab.onclick = () => {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
    };

    registerTab.onclick = () => {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
    };

   
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      themeToggle.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
    });

    
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      let valid = true;

      if (!loginEmail.value.includes('@')) {
        loginEmailError.style.display = 'block';
        valid = false;
      } else loginEmailError.style.display = 'none';

      if (loginPassword.value.trim() === '') {
        loginPasswordError.style.display = 'block';
        valid = false;
      } else loginPasswordError.style.display = 'none';

      if (valid) {
        loginSuccess.style.display = 'block';
        loginForm.reset();
      }
    });

    
    registerForm.addEventListener('submit', e => {
      e.preventDefault();
      let valid = true;

      if (regName.value.trim() === '') {
        regNameError.style.display = 'block';
        valid = false;
      } else regNameError.style.display = 'none';

      if (!regEmail.value.includes('@')) {
        regEmailError.style.display = 'block';
        valid = false;
      } else regEmailError.style.display = 'none';

      if (regPassword.value.length < 6) {
        regPasswordError.style.display = 'block';
        valid = false;
      } else regPasswordError.style.display = 'none';

      if (valid) {
        regSuccess.style.display = 'block';
        registerForm.reset();
      }
    });
  </script>
</body>
</html>
